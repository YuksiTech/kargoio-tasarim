<!doctype html>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1A1A}a:hover{color:#000}

<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF8F5; color: #1A1A1A; font-family: 'DM Sans', sans-serif; position: relative; overflow: hidden; padding: 58px 18px 0">
  <div style="display: flex; justify-content: space-between; align-items: center">

  <div style="display: flex; gap: 8px; margin-top: 16px">

    <span style="flex: 1; height: 6px; border-radius: 4px; background: #E11D2E"></span>

      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 12px; font-weight: 600; color: #9F1020; background: #FFE4E6; border-radius: 999px; padding: 6px 10px">Tazmin · hasar</span>

      <div style="font-size: 13px; font-weight: 600; color: #8A7F7C; margin-top: 2px">KG-48216611 · Aras · İzmir → Bursa</div>
      <div style="font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 40px; letter-spacing: -0.3px; margin-top: 18px">₺3.400</div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 18px">
        <div style="height: 76px; border-radius: 18px; background: #F3EFEE; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: #8A7F7C">[Görsel 1]</div>
        <div style="height: 76px; border-radius: 18px; background: #F3EFEE; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: #8A7F7C">[Görsel 2]</div>

      <div style="display: flex; gap: 10px; margin-top: auto">

  <div style="position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font-size: 12px; font-weight: 500; color: #8A7F7C">Kart kart ilerle · onaylar Face ID ile doğrulanır</div>
