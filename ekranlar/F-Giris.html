<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>F · Giriş</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&amp;family=Figtree:wght@400;500;600&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E0E12}a:hover{color:#000}
input::placeholder{color:#9A9BA1}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E12; color: #fff; font-family: 'Figtree', sans-serif; position: relative; overflow: hidden">
  <div style="position: absolute; width: 380px; height: 380px; border-radius: 50%; background: #E2001A; opacity: 0.18; filter: blur(100px); top: -120px; right: -160px"></div>

  <div style="position: absolute; left: 28px; right: 28px; top: 60px; display: flex; justify-content: space-between; align-items: center">
    <img src="../assets/logo.png" alt="kargoio" style="width: 96px; height: 34px; object-fit: contain; object-position: left center; filter: grayscale(1) contrast(10) invert(1); mix-blend-mode: screen">
    <div role="group" aria-label="Dil" style="display: flex; background: #1C1C23; border-radius: 999px; padding: 3px">
      <button type="button" aria-pressed="true" style="height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: #fff; color: #0E0E12; font: 600 12px 'Figtree', sans-serif">TR</button>
      <button type="button" style="height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: #A9AAB2; font: 500 12px 'Figtree', sans-serif">EN</button>
    </div>
  </div>

  <div style="position: absolute; left: 200px; top: 140px; width: 170px; height: 170px; border-radius: 50%; border: 26px solid #fff; box-sizing: border-box"></div>
  <div style="position: absolute; left: 132px; top: 160px; width: 26px; height: 160px; border-radius: 13px; background: #E2001A; transform: rotate(32deg)"></div>
  <div style="position: absolute; left: 190px; top: 112px; width: 36px; height: 36px; border-radius: 50%; background: #fff"></div>

  <div style="position: absolute; left: 28px; right: 28px; top: 350px">
    <div style="font-family: 'Outfit', sans-serif; font-weight: 200; font-size: 42px; line-height: 1.08; letter-spacing: -1.2px">Türkiye'nin her kapısına,<br><span style="font-weight: 400">tek dokunuşla.</span></div>
  </div>

  <form style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; color: #0E0E12; border-radius: 32px 32px 0 0; padding: 26px 24px 32px; display: flex; flex-direction: column; gap: 12px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3B3C42">E-posta
      <input type="email" placeholder="ornek@firma.com" style="height: 54px; border-radius: 16px; border: 1px solid #E7E6E1; background: #F6F5F2; padding: 0 16px; font: 500 17px 'Figtree', sans-serif; color: #0E0E12">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3B3C42">Şifre
      <input type="password" placeholder="••••••••" style="height: 54px; border-radius: 16px; border: 1px solid #E7E6E1; background: #F6F5F2; padding: 0 16px; font: 500 17px 'Figtree', sans-serif; color: #0E0E12">
    </label>
    <div style="display: flex; gap: 10px; margin-top: 6px">
      <button type="button" style="flex: 1; height: 58px; border: 0; border-radius: 18px; background: #E2001A; color: #fff; font: 600 17px 'Figtree', sans-serif; display: flex; align-items: center; justify-content: space-between; padding: 0 20px">Giriş yap
        <span style="display: flex; align-items: center; gap: 7px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #fff"></span><span style="width: 4px; height: 16px; border-radius: 2px; background: #fff; transform: rotate(32deg)"></span><span style="width: 15px; height: 15px; border-radius: 50%; border: 3px solid #fff; box-sizing: border-box"></span></span>
      </button>
      <button type="button" aria-label="Face ID ile giriş" style="width: 58px; height: 58px; border: 1px solid #E7E6E1; border-radius: 18px; background: #fff; color: #0E0E12; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9v1M15 9v1M12 9v4h-1M9.5 15.5a3.5 3.5 0 0 0 5 0"></path></svg></button>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; margin-top: 4px">
      <a href="#" style="text-decoration: none; color: #61626A">Şifremi unuttum</a>
      <a href="#" style="text-decoration: none">Hesap aç · Bayi ol</a>
    </div>
  </form>
</div>
</body>
</html>
