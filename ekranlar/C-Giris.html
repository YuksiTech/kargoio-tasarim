<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<title>C · Giriş</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1A1A}a:hover{color:#000}
input::placeholder{color:#A39A97}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E11D2E; color: #fff; font-family: 'DM Sans', sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="position: absolute; width: 300px; height: 300px; border-radius: 80px; background: #9F1020; transform: rotate(18deg); top: -90px; right: -110px"></div>
  <div style="position: absolute; width: 150px; height: 150px; border-radius: 44px; background: #FF5A67; transform: rotate(-12deg); top: 210px; right: 28px"></div>
  <div style="position: absolute; width: 74px; height: 74px; border-radius: 22px; background: #FFE4E6; transform: rotate(8deg); top: 150px; right: 150px"></div>

  <div style="position: relative; padding: 70px 28px 0">
    <div style="font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 27px; letter-spacing: -0.3px">kargoio</div>
    <div style="font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 45px; line-height: 1.06; letter-spacing: -0.8px; margin-top: 168px">Gönder.<br>Takip et.<br>Kazan.</div>
  </div>

  <form style="position: relative; margin-top: auto; background: #FFF8F5; color: #1A1A1A; border-radius: 32px 32px 0 0; padding: 26px 24px 34px; display: flex; flex-direction: column; gap: 12px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">E-posta
      <input type="email" placeholder="ornek@firma.com" style="height: 54px; border-radius: 18px; border: 2px solid #F3E3DE; background: #fff; padding: 0 16px; font: 500 16px 'DM Sans', sans-serif; color: #1A1A1A">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">Şifre
      <input type="password" placeholder="••••••••" style="height: 54px; border-radius: 18px; border: 2px solid #F3E3DE; background: #fff; padding: 0 16px; font: 500 16px 'DM Sans', sans-serif; color: #1A1A1A">
    </label>
    <button type="button" style="height: 58px; border: 0; border-radius: 20px; background: #1A1A1A; color: #fff; font: 600 17px 'DM Sans', sans-serif; margin-top: 6px">Giriş yap →</button>
    <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; margin-top: 2px">
      <a href="#" style="text-decoration: none">Şifremi unuttum</a>
      <a href="#" style="text-decoration: none; color: #B3121F">Kayıt ol</a>
    </div>
  </form>
</div>
