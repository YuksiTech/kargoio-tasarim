<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>E · Giriş</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&amp;family=Figtree:wght@400;500;600&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111114}a:hover{color:#000}
input::placeholder{color:#9A9BA1}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #111114; font-family: 'Figtree', sans-serif; position: relative; overflow: hidden">
  <div style="position: relative; height: 470px; background: #E2001A; overflow: hidden; color: #fff">
    <div style="position: absolute; left: 180px; top: 120px; width: 220px; height: 220px; border-radius: 50%; border: 34px solid rgba(255,255,255,0.96); box-sizing: border-box"></div>
    <div style="position: absolute; left: 91px; top: 145px; width: 34px; height: 210px; border-radius: 17px; background: rgba(255,255,255,0.96); transform: rotate(32deg)"></div>
    <div style="position: absolute; left: 171px; top: 87px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.96)"></div>

    <div style="position: absolute; left: 28px; right: 28px; top: 60px; display: flex; justify-content: space-between; align-items: center">
      <img src="../assets/logo.png" alt="kargoio" style="width: 104px; height: 36px; object-fit: contain; object-position: left center; filter: grayscale(1) contrast(10) invert(1); mix-blend-mode: screen">
      <div role="group" aria-label="Dil" style="display: flex; background: rgba(0,0,0,0.16); border-radius: 999px; padding: 3px">
        <button type="button" aria-pressed="true" style="height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: #fff; color: #111114; font: 600 12px 'Figtree', sans-serif">TR</button>
        <button type="button" style="height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: #fff; font: 500 12px 'Figtree', sans-serif">EN</button>
      </div>
    </div>
    <div style="position: absolute; left: 28px; bottom: 34px; font-family: 'Jost', sans-serif; font-weight: 500; font-size: 40px; line-height: 1.05; letter-spacing: -0.8px">Türkiye'nin<br>her kapısına.</div>
  </div>

  <form style="padding: 26px 28px 0; display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3B3C42">E-posta
      <input type="email" placeholder="ornek@firma.com" style="height: 54px; border: 0; border-bottom: 2px solid #E6E5E0; background: transparent; padding: 0 2px; font: 500 18px 'Figtree', sans-serif; color: #111114; border-radius: 0">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3B3C42">Şifre
      <input type="password" placeholder="••••••••" style="height: 54px; border: 0; border-bottom: 2px solid #E6E5E0; background: transparent; padding: 0 2px; font: 500 18px 'Figtree', sans-serif; color: #111114; border-radius: 0">
    </label>
    <div style="display: flex; align-items: center; gap: 12px; margin-top: 12px">
      <button type="button" style="flex: 1; height: 58px; border: 0; border-radius: 16px; background: #111114; color: #fff; font: 600 17px 'Figtree', sans-serif; display: flex; align-items: center; justify-content: space-between; padding: 0 20px">Giriş yap
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #fff"></span><span style="width: 4px; height: 16px; border-radius: 2px; background: #E2001A; transform: rotate(32deg)"></span><span style="width: 14px; height: 14px; border-radius: 50%; border: 3px solid #fff; box-sizing: border-box"></span></span>
      </button>
      <button type="button" aria-label="Face ID ile giriş" style="width: 58px; height: 58px; border: 2px solid #E6E5E0; border-radius: 16px; background: #fff; color: #111114; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9v1M15 9v1M12 9v4h-1M9.5 15.5a3.5 3.5 0 0 0 5 0"></path></svg></button>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; margin-top: 4px">
      <a href="#" style="text-decoration: none; color: #6A6B72">Şifremi unuttum</a>
      <a href="#" style="text-decoration: none; color: #E2001A">Hesap aç</a>
    </div>
  </form>
</div>
</body>
</html>
