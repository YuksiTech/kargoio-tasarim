<!doctype html>
<html lang="tr">
<head>

<style>
body{margin:0}
a{color:#0B0B0F}a:hover{color:#000}

<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAFAF7; color: #0B0B0F; font-family: 'Outfit', sans-serif; position: relative; overflow: hidden; padding: 56px 20px 0">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <img src="../assets/logo.png" alt="kargoio" style="width: 86px; height: 30px; object-fit: contain; object-position: left center; mix-blend-mode: multiply">
    <span style="font-size: 12px; font-weight: 500; letter-spacing: 1.6px; color: #fff; background: #0B0B0F; border-radius: 999px; padding: 7px 12px">YÖNETİM</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 20px">
    <div style="background: #fff; border: 1px solid #E8E8E3; border-radius: 20px; padding: 12px"><div style="font-size: 28px; font-weight: 200; letter-spacing: -1px; font-variant-numeric: tabular-nums">1.284</div><div style="font-size: 12px; color: #5F6168">Bugün kargo</div></div>
    <div style="background: #fff; border: 1px solid #E8E8E3; border-radius: 20px; padding: 12px"><div style="font-size: 28px; font-weight: 200; letter-spacing: -1px; font-variant-numeric: tabular-nums">₺186K</div><div style="font-size: 12px; color: #5F6168">Kapıda ödeme</div></div>
    <div style="background: #fff; border: 1px solid #E8E8E3; border-radius: 20px; padding: 12px"><div style="font-size: 28px; font-weight: 200; letter-spacing: -1px; color: #E2001A">7</div><div style="font-size: 12px; color: #5F6168">Kargo hatası</div></div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 24px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 300; letter-spacing: -0.8px">Onay <span style="font-weight: 500">bekleyen</span></h1>
    <span style="font-size: 30px; font-weight: 200; color: #E2001A">14</span>
  </div>

  <div role="tablist" style="display: flex; gap: 6px; margin-top: 12px">
    <button type="button" role="tab" aria-selected="true" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: #0B0B0F; color: #fff; font: 500 14px 'Outfit', sans-serif">Tümü</button>
    <button type="button" role="tab" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #E8E8E3; background: #fff; color: #3A3B40; font: 400 14px 'Outfit', sans-serif">Para 6</button>
    <button type="button" role="tab" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #E8E8E3; background: #fff; color: #3A3B40; font: 400 14px 'Outfit', sans-serif">Tazmin 4</button>
    <button type="button" role="tab" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #E8E8E3; background: #fff; color: #3A3B40; font: 400 14px 'Outfit', sans-serif">Bayi 4</button>
  </div>

  <div style="margin-top: 14px; background: #fff; border: 1px solid #E8E8E3; border-radius: 26px; padding: 18px; position: relative; overflow: hidden">
    <div style="position: absolute; left: -16px; top: 18px; width: 30px; height: 6px; border-radius: 3px; background: #E2001A; transform: skewX(-32deg)"></div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #5F6168"><span>Tazmin · hasar</span><span>18 dk</span></div>
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 8px">
      <div><div style="font-size: 20px; font-weight: 500">Ege Tekstil</div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5F6168; margin-top: 2px">KG 4821 6611 · Aras</div></div>
      <div style="font-size: 30px; font-weight: 200; letter-spacing: -1px; font-variant-numeric: tabular-nums">₺3.400</div>
    </div>
    <div style="display: flex; gap: 6px; margin-top: 12px; font-size: 12px">
      <span style="background: #F4F4EF; border-radius: 999px; padding: 5px 10px">2 görsel</span>
      <span style="background: #F4F4EF; border-radius: 999px; padding: 5px 10px">Fatura ✓</span>
      <span style="background: #ECFDF3; color: #15803D; border-radius: 999px; padding: 5px 10px">Tavan içinde</span>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 16px">
      <button type="button" style="flex: 1; height: 50px; border: 1px solid #E8E8E3; border-radius: 999px; background: #fff; font: 500 15px 'Outfit', sans-serif; color: #0B0B0F">Reddet</button>
      <button type="button" style="flex: 1.5; height: 50px; border: 0; border-radius: 999px; background: #0B0B0F; font: 500 15px 'Outfit', sans-serif; color: #fff">Onayla</button>
    </div>
  </div>

  <div style="margin-top: 10px; background: #fff; border: 1px solid #E8E8E3; border-radius: 22px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #F0F0EB">
      <div style="flex: 1"><div style="font-size: 16px; font-weight: 500">Nilüfer Bayi</div><div style="font-size: 13px; color: #5F6168">Bakiye düzeltme · 4 dk</div></div>
      <span style="font-size: 18px; font-weight: 300; font-variant-numeric: tabular-nums">+₺1.250</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9B9CA3" stroke-width="1.8" stroke-linecap="round"><path d="m9 6 6 6-6 6"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px">
      <div style="flex: 1"><div style="font-size: 16px; font-weight: 500">Osmangazi Kargo Noktası</div><div style="font-size: 13px; color: #5F6168">Bayi başvurusu · 1 sa</div></div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9B9CA3" stroke-width="1.8" stroke-linecap="round"><path d="m9 6 6 6-6 6"></path></svg>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font-size: 13px; color: #8A8B92">Onaylar Face ID ile doğrulanır</div>
</div>
</body>
</html>
