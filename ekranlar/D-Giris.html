<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>D · Giriş</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B0B0F}a:hover{color:#000}
input::placeholder{color:#9B9CA3}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAFAF7; color: #0B0B0F; font-family: 'Outfit', sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 64px 28px 36px">
  <div style="position: absolute; top: -40px; right: -70px; width: 120px; height: 420px; background: #E2001A; transform: rotate(32deg); border-radius: 60px"></div>
  <div style="position: absolute; top: 84px; right: 92px; width: 46px; height: 46px; border-radius: 50%; background: #E2001A"></div>

  <img src="../assets/logo.png" alt="kargoio" style="position: relative; width: 112px; height: 40px; object-fit: contain; object-position: left center; mix-blend-mode: multiply">

  <div style="position: relative; margin-top: 120px">
    <div style="font-size: 13px; font-weight: 500; letter-spacing: 2.4px; color: #5F6168">KARGOIO · TÜRKİYE</div>
    <h1 style="margin: 14px 0 0; font-size: 50px; line-height: 1.04; font-weight: 300; letter-spacing: -1.6px">Gönderin,<br>gerisini<br><span style="font-weight: 500; color: #E2001A">biz düşünelim.</span></h1>
  </div>

  <form style="position: relative; margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #3A3B40">E-posta
      <input type="email" placeholder="ornek@firma.com" style="height: 56px; border-radius: 16px; border: 1px solid #E8E8E3; background: #fff; padding: 0 18px; font: 400 17px 'Outfit', sans-serif; color: #0B0B0F">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #3A3B40">Şifre
      <input type="password" placeholder="••••••••" style="height: 56px; border-radius: 16px; border: 1px solid #E8E8E3; background: #fff; padding: 0 18px; font: 400 17px 'Outfit', sans-serif; color: #0B0B0F">
    </label>
    <div style="display: flex; gap: 10px; margin-top: 8px">
      <button type="button" style="flex: 1; height: 58px; border: 0; border-radius: 999px; background: #0B0B0F; color: #fff; font: 500 17px 'Outfit', sans-serif; letter-spacing: 0.2px">Giriş yap</button>
      <button type="button" aria-label="Face ID ile giriş" style="width: 58px; height: 58px; border: 1px solid #E8E8E3; border-radius: 50%; background: #fff; color: #0B0B0F; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9v1M15 9v1M12 9v4h-1M9.5 15.5a3.5 3.5 0 0 0 5 0"></path></svg></button>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 14px; margin-top: 6px">
      <a href="#" style="text-decoration: none; color: #5F6168">Şifremi unuttum</a>
      <a href="#" style="text-decoration: none; font-weight: 500">Hesap aç →</a>
    </div>
  </form>
</div>
</body>
</html>
