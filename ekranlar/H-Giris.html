<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>H · Giriş</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1A1A}a:hover{color:#000}
input::placeholder{color:#A39A97}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E11D2E; color: #fff; font-family: 'DM Sans', sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="position: absolute; width: 300px; height: 300px; border-radius: 80px; background: #9F1020; transform: rotate(18deg); top: -90px; right: -110px"></div>
  <div style="position: absolute; width: 150px; height: 150px; border-radius: 44px; background: #FF5A67; transform: rotate(-12deg); top: 214px; right: 26px"></div>
  <div style="position: absolute; width: 74px; height: 74px; border-radius: 22px; background: #FFE4E6; transform: rotate(8deg); top: 150px; right: 156px; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#B3121F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21 8-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"></path></svg></div>

  <div style="position: relative; padding: 62px 28px 0">
    <img src="../assets/logo.png" alt="kargoio" style="width: 112px; height: 38px; object-fit: contain; object-position: left center; filter: grayscale(1) contrast(10) invert(1); mix-blend-mode: screen">
    <div style="font-weight: 700; font-size: 46px; line-height: 1.02; letter-spacing: -1.2px; margin-top: 196px">Gönder.<br>Takip et.<br>Kazan.</div>
  </div>

  <form style="position: relative; margin-top: auto; background: #FFF8F5; color: #1A1A1A; border-radius: 32px 32px 0 0; padding: 26px 24px 34px; display: flex; flex-direction: column; gap: 12px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">E-posta
      <input type="email" placeholder="ornek@firma.com" style="height: 56px; border-radius: 18px; border: 2px solid #F3E3DE; background: #fff; padding: 0 16px; font: 500 17px 'DM Sans', sans-serif; color: #1A1A1A">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Şifre
      <input type="password" placeholder="••••••••" style="height: 56px; border-radius: 18px; border: 2px solid #F3E3DE; background: #fff; padding: 0 16px; font: 500 17px 'DM Sans', sans-serif; color: #1A1A1A">
    </label>
    <div style="display: flex; gap: 10px; margin-top: 6px">
      <button type="button" style="flex: 1; height: 60px; border: 0; border-radius: 20px; background: #1A1A1A; color: #fff; font: 700 17px 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: space-between; padding: 0 20px">Giriş yap
        <span style="display: flex; align-items: center; gap: 7px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #fff"></span><span style="width: 4px; height: 16px; border-radius: 2px; background: #E11D2E; transform: rotate(32deg)"></span><span style="width: 15px; height: 15px; border-radius: 50%; border: 3px solid #fff; box-sizing: border-box"></span></span>
      </button>
      <button type="button" aria-label="Face ID ile giriş" style="width: 60px; height: 60px; border: 2px solid #F3E3DE; border-radius: 20px; background: #fff; color: #1A1A1A; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9v1M15 9v1M12 9v4h-1M9.5 15.5a3.5 3.5 0 0 0 5 0"></path></svg></button>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-top: 2px">
      <a href="#" style="text-decoration: none">Şifremi unuttum</a>
      <a href="#" style="text-decoration: none; color: #B3121F">Kayıt ol · Bayi ol</a>
    </div>
  </form>
</div>
</body>
</html>
