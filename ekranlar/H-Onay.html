<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>H · Yönetim</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1A1A}a:hover{color:#000}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF8F5; color: #1A1A1A; font-family: 'DM Sans', sans-serif; position: relative; overflow: hidden; padding: 56px 18px 0">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 12px; font-weight: 700; color: #fff; background: #1A1A1A; border-radius: 999px; padding: 7px 12px">Yönetim</span>
    <img src="../assets/logo.png" alt="kargoio" style="width: 80px; height: 28px; object-fit: contain; object-position: right center; mix-blend-mode: multiply">
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px">
    <div style="background: #1A1A1A; color: #fff; border-radius: 22px; padding: 12px"><div style="font-weight: 700; font-size: 24px">1.284</div><div style="font-size: 12px; color: #C9C2BF">Bugün kargo</div></div>
    <div style="background: #fff; border: 2px solid #F3E3DE; border-radius: 22px; padding: 12px"><div style="font-weight: 700; font-size: 24px">₺186K</div><div style="font-size: 12px; color: #8A7F7C">Kapıda ödeme</div></div>
    <div style="background: #FFE4E6; border-radius: 22px; padding: 12px; color: #9F1020"><div style="font-weight: 700; font-size: 24px">7</div><div style="font-size: 12px">Kargo hatası</div></div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 20px">
    <div style="font-weight: 700; font-size: 32px; letter-spacing: -1px">Onay bekleyen</div>
    <span style="font-size: 14px; font-weight: 700; color: #8A7F7C">3 / 14</span>
  </div>
  <div style="display: flex; gap: 6px; margin-top: 10px">
    <span style="flex: 1; height: 8px; border-radius: 5px; background: #E11D2E"></span>
    <span style="flex: 1; height: 8px; border-radius: 5px; background: #E11D2E"></span>
    <span style="flex: 1; height: 8px; border-radius: 5px; background: #1A1A1A"></span>
    <span style="flex: 4; height: 8px; border-radius: 5px; background: #F3E3DE"></span>
  </div>

  <div style="position: relative; margin-top: 20px; height: 420px">
    <div style="position: absolute; left: 24px; right: 24px; top: 0; height: 390px; border-radius: 32px; background: #F3E3DE"></div>
    <div style="position: absolute; left: 12px; right: 12px; top: 12px; height: 390px; border-radius: 32px; background: #FFE4E6"></div>
    <div style="position: absolute; left: 0; right: 0; top: 24px; height: 396px; border-radius: 32px; background: #fff; box-shadow: 0 18px 40px rgba(159,16,32,0.12); padding: 22px; box-sizing: border-box; display: flex; flex-direction: column">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 12px; font-weight: 700; color: #9F1020; background: #FFE4E6; border-radius: 999px; padding: 6px 10px">Tazmin · hasar</span>
        <span style="font-size: 12px; font-weight: 600; color: #8A7F7C">18 dk önce</span>
      </div>
      <div style="font-weight: 700; font-size: 26px; letter-spacing: -0.6px; margin-top: 14px">Ege Tekstil</div>
      <div style="font-family: 'DM Mono', monospace; font-size: 12px; color: #8A7F7C">KG 4821 6611 · Aras · İzmir → Bursa</div>
      <div style="font-weight: 700; font-size: 44px; letter-spacing: -1.4px; margin-top: 12px">₺3.400</div>
      <div style="font-size: 12px; font-weight: 600; color: #15803D">Fatura tutarı tavan içinde</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px">
        <div style="height: 64px; border-radius: 18px; background: #F3EFEE; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #8A7F7C">[Görsel 1]</div>
        <div style="height: 64px; border-radius: 18px; background: #F3EFEE; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #8A7F7C">[Görsel 2]</div>
        <div style="height: 64px; border-radius: 18px; background: #F3EFEE; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #8A7F7C">[Fatura]</div>
      </div>
      <div style="display: flex; gap: 10px; margin-top: auto">
        <button type="button" style="flex: 1; height: 60px; border: 2px solid #1A1A1A; border-radius: 20px; background: #fff; font: 700 16px 'DM Sans', sans-serif; color: #1A1A1A">Reddet</button>
        <button type="button" style="flex: 1.4; height: 60px; border: 0; border-radius: 20px; background: #E11D2E; font: 700 16px 'DM Sans', sans-serif; color: #fff">Onayla</button>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 28px; text-align: center; font-size: 12px; font-weight: 600; color: #8A7F7C">Kart kart ilerle · onaylar Face ID ile doğrulanır</div>
</div>
</body>
</html>
