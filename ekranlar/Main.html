<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>A · Giriş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5F5F7}a:hover{color:#ffffff}
input::placeholder{color:#6E6E7A}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E12; color: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 72px 28px 40px">
  <div style="position: absolute; width: 420px; height: 420px; border-radius: 50%; background: #E11D2E; opacity: 0.22; filter: blur(110px); top: -180px; left: -15px"></div>

  <div style="position: relative; display: flex; align-items: center; justify-content: space-between">
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif; font-weight: 600; font-size: 23px; letter-spacing: -0.5px; color: #E11D2E">kargoio</div>
    <div style="font-size: 12px; color: #A3A3AE; border: 1px solid #26262E; border-radius: 999px; padding: 6px 12px">TR</div>
  </div>

  <div style="position: relative; margin-top: 88px">
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif; font-weight: 600; font-size: 40px; line-height: 1.02; letter-spacing: -0.6px">Her gönderi,<br><span style="color: #FF4D5E">kusursuz.</span></div>
    <p style="margin: 18px 0 0; color: #A3A3AE; font-size: 15px; line-height: 1.5">Kurumsal, bayi ve yönetim hesabınızla giriş yapın.</p>
  </div>

  <form style="position: relative; margin-top: auto; display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: #A3A3AE; letter-spacing: 0.4px">E-POSTA
      <input type="email" placeholder="ornek@firma.com" style="height: 54px; border-radius: 14px; border: 1px solid #26262E; background: #17171D; color: #F5F5F7; padding: 0 16px; font: 500 16px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif">
    </label>
    <label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: #A3A3AE; letter-spacing: 0.4px">ŞİFRE
      <input type="password" placeholder="••••••••" style="height: 54px; border-radius: 14px; border: 1px solid #26262E; background: #17171D; color: #F5F5F7; padding: 0 16px; font: 500 16px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif">
    </label>
    <a href="#" style="align-self: flex-end; font-size: 13px; text-decoration: none; color: #A3A3AE">Şifremi unuttum</a>
    <button type="button" style="height: 56px; border: 0; border-radius: 999px; background: #E11D2E; color: #fff; font: 600 16px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif; margin-top: 4px">Giriş yap</button>
    <button type="button" style="height: 56px; border: 1px solid #26262E; border-radius: 999px; background: transparent; color: #F5F5F7; font: 500 15px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9v1M15 9v1M12 9v4h-1M9.5 15.5a3.5 3.5 0 0 0 5 0"></path></svg>
      Face ID ile giriş
    </button>
    <p style="margin: 10px 0 0; text-align: center; font-size: 13px; color: #A3A3AE">Hesabın yok mu? <a href="#" style="text-decoration: none; font-weight: 600">Kayıt ol</a></p>
  </form>
</div>
</body>
</html>
