<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B · Giriş</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111113}a:hover{color:#000}
input::placeholder{color:#9A9AA2}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F6F4; color: #111113; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; padding: 64px 24px 36px">
  <div style="font-weight: 800; font-size: 24px; letter-spacing: -0.8px; color: #E11D2E">kargoio</div>

  <div style="margin-top: 36px; background: #FFFFFF; border-radius: 24px; padding: 18px; border: 1px solid #ECECE8">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 12px; font-weight: 700; color: #2563EB">● Yolda</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6B6B73">KG-48217695</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 500">BUR</span>
      <span style="font-size: 12px; color: #6B6B73">Yarın 10:15 – 12:45</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 500">ANK</span>
    </div>
    <div style="position: relative; height: 18px; margin-top: 10px">
      <div style="position: absolute; left: 0; right: 0; top: 8px; height: 2px; border-radius: 2px; background: #ECECE8"></div>
      <div style="position: absolute; left: 0; width: 55%; top: 8px; height: 2px; border-radius: 2px; background: #2563EB"></div>
      <div style="position: absolute; left: calc(55% - 9px); top: 0; width: 18px; height: 18px; border-radius: 50%; background: #2563EB; border: 3px solid #fff; box-sizing: border-box; box-shadow: 0 0 0 1px #2563EB"></div>
    </div>
  </div>

  <h1 style="margin: 36px 0 0; font-size: 32px; line-height: 1.15; letter-spacing: -0.8px; font-weight: 800">Kargoların seni<br>bekliyor.</h1>
  <p style="margin: 10px 0 0; font-size: 15px; color: #6B6B73">Hesabınla giriş yap, kaldığın yerden devam et.</p>

  <form style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3A3A40">E-posta
      <input type="email" placeholder="ornek@firma.com" style="height: 54px; border-radius: 16px; border: 1px solid #E2E2DD; background: #fff; padding: 0 16px; font: 500 16px 'Plus Jakarta Sans', sans-serif; color: #111113">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3A3A40">Şifre
      <input type="password" placeholder="••••••••" style="height: 54px; border-radius: 16px; border: 1px solid #E2E2DD; background: #fff; padding: 0 16px; font: 500 16px 'Plus Jakarta Sans', sans-serif; color: #111113">
    </label>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3A3A40"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #111113">Face ID'yi aç</label>
      <a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none">Şifremi unuttum</a>
    </div>
    <button type="button" style="height: 56px; border: 0; border-radius: 16px; background: #111113; color: #fff; font: 700 16px 'Plus Jakarta Sans', sans-serif; margin-top: 6px">Giriş yap</button>
    <p style="margin: 6px 0 0; text-align: center; font-size: 13px; color: #6B6B73">Hesabın yok mu? <a href="#" style="font-weight: 700; color: #E11D2E; text-decoration: none">Kayıt ol</a></p>
  </form>
</div>
</body>
</html>
